# Render Blueprint — one-click deploy of the Agent on a Leash dashboard.
# In Render: New + → Blueprint → pick this repo. Render reads this file.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: agent-on-a-leash
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      # Speculos can't run on a public host, so use the mock signer there.
      - key: USE_MOCK_SIGNER
        value: "true"
      # Paste a real base58 signature captured from Speculos (see docs/speculos.md)
      # to display a real, dev/build-time signature on approved transfers.
      # Leave blank to show the simulated signature instead.
      - key: SPECULOS_SIGNATURE
        sync: false
      # Optional: override the note shown beneath a captured signature.
      - key: SPECULOS_SIGNATURE_NOTE
        sync: false
    # PORT is provided by Render automatically; the server reads process.env.PORT.
